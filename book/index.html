<script id="nordsym-booking-flow">
(function(){
  var endpoint = "/api/book";
  var availabilityEndpoint = "https://nordsym.app.n8n.cloud/webhook/availability";
  var SUPPORTED_ROUTE = { lang: "sv", offer: "ai_i_drift" };
  var ACQUISITION_PARAM_KEYS = [
    "source",
    "consequences",
    "information_locations",
    "systems_count",
    "mandate",
    "qualification_signal",
    "utm_id",
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_content"
  ];
  var ACQUISITION_ALLOWED = {
    source: ["meta_paid"],
    consequences: ["time", "delay", "errors_rework", "lost_revenue", "weak_follow_up", "other"],
    information_locations: ["one_system", "several_systems", "documents_messages_email", "individual_people", "no_complete_overview"],
    systems_count: ["1", "2", "3-5", "6+"],
    mandate: ["sponsor_now", "owner_in_place", "hiring_owner", "exploring"],
    qualification_signal: ["form_complete", "prequalified"]
  };
  var UTM_PARAM_KEYS = ["utm_id", "utm_source", "utm_medium", "utm_campaign", "utm_content"];
  var params = new URLSearchParams(window.location.search);
  var paidVariant = params.get("lang") === SUPPORTED_ROUTE.lang && params.get("offer") === SUPPORTED_ROUTE.offer;
  var paidFocus = "AI-beredskapskartläggning";
  var webhookSource = paidVariant ? "nordsym.com/ai-i-drift" : "nordsym.com/book";
  var acquisition = {};
  var preCallContext = {};
  var MULTI_VALUE_KEYS = ["consequences", "information_locations"];
  if (paidVariant) { try { preCallContext = JSON.parse(sessionStorage.getItem("nordsym_ai_i_drift_pre_call_v1") || "{}"); } catch (_) { preCallContext = {}; } }

  function categoricalValue(value) {
    var raw = String(value || "").trim();
    if (!raw || raw.indexOf("@") !== -1 || raw.replace(/\D/g, "").length >= 7) return "";
    return raw
      .toLowerCase()
      .replace(/[^a-z0-9._~-]+/g, "_")
      .replace(/^_+|_+$/g, "")
      .slice(0, 120);
  }

  if (paidVariant) {
    Object.keys(ACQUISITION_ALLOWED).forEach(function(key){
      var value = params.get(key);
      if (MULTI_VALUE_KEYS.indexOf(key) !== -1) {
        var values = String(value || "").split(",").filter(Boolean);
        if (values.length && values.every(function(item){ return ACQUISITION_ALLOWED[key].indexOf(item) !== -1; })) acquisition[key] = Array.from(new Set(values)).join(",");
      } else if (ACQUISITION_ALLOWED[key].indexOf(value) !== -1) acquisition[key] = value;
    });
  }
  UTM_PARAM_KEYS.forEach(function(key){
    var value = categoricalValue((window.__nordsymPaidContext && window.__nordsymPaidContext[key]) || params.get(key));
    if (value) acquisition[key] = value;
  });
  var hasCompleteQualification = paidVariant &&
    Object.keys(ACQUISITION_ALLOWED).every(function(key){
      return Boolean(acquisition[key]);
    });
  if (hasCompleteQualification) {
    acquisition.qualification_signal =
      acquisition.systems_count !== "1" &&
      acquisition.mandate !== "exploring"
        ? "prequalified"
        : "form_complete";
  }

  var analyticsContext = Object.assign({
    booking_variant: paidVariant ? "ai_i_drift_sv" : "default",
    entry_type: window.__nordsymPaidContext && window.__nordsymPaidContext.entry_type,
    entry_id: window.__nordsymPaidContext && window.__nordsymPaidContext.entry_id,
    entry_path: window.__nordsymPaidContext && window.__nordsymPaidContext.entry_path,
    entry_timestamp: window.__nordsymPaidContext && window.__nordsymPaidContext.entry_timestamp
  }, acquisition);
  if (paidVariant) {
    analyticsContext.lang = SUPPORTED_ROUTE.lang;
    analyticsContext.offer = SUPPORTED_ROUTE.offer;
  }
  window.__nordsymAnalyticsContext = analyticsContext;

  var copy = paidVariant ? {
    title: "Boka en kostnadsfri genomgång - NordSym",
    description: "Boka en kostnadsfri genomgång av ert AI-arbete, systemen det berör och vad som krävs för att få det att fungera i vardagen.",
    heading: "Boka en kostnadsfri genomgång",
    briefHeading: "Er genomgång",
    briefLabels: { focus: "Fokus", date: "Datum", time: "Tid", contact: "Kontakt" },
    railDescription: "Ta med det AI-arbete som är viktigast nu. <br>Få en konkret rekommendation om vad som saknas, vad som bör byggas och vem som behöver äga nästa steg.",
    stepLabels: ["Fokus", "Tid", "Uppgifter", "Klart"],
    back: "← Tillbaka",
    startOver: "Börja om",
    continue: "Fortsätt",
    focusHeading: "Vad vill ni få att fungera?",

  function initialState() {
    return {
      focus: paidVariant ? paidFocus : "",
      date: "",
      dateLabel: "",
      time: "",
      name: "",
      email: "",
      company: "",
      notes: ""
    };
  }

  var state = initialState();
  var calendarView = new Date();
  calendarView.setHours(12, 0, 0, 0);
  calendarView.setDate(1);
  var availabilityRequest = 0;
  var bookingRequestId = null;
  var main = document.querySelector("main");
  if (!main) return;
  var sections = Array.prototype.slice.call(main.children);
  var stepper = sections[0];
  var content = sections[1];
  var nav = sections[2];
  if (!stepper || !content || !nav) return;
  main.id = "booking-main";
  stepper.id = "booking-stepper";
  content.id = "booking-content";
  nav.id = "booking-nav";
  var back = nav.querySelector("button:first-child");
  var next = nav.querySelector("button:last-child");
  back.id = "booking-back";
  next.id = "booking-continue";
  var step = 1;

  function trackingProperties(properties) {
    return Object.assign({ surface: "book" }, analyticsContext, properties || {});
  }

  function captureBooking(eventName, properties) {
    if (window.posthog && window.posthog.capture) {
      window.posthog.capture(eventName, trackingProperties(properties));
    }
  }

  function text(value) {
    return String(value || "").replace(/[&<>"']/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];
    });
  }

  function prepareBriefTargets() {
    var labels = Array.prototype.slice.call(document.querySelectorAll("aside div"));
    Object.keys(copy.briefLabels).forEach(function(key){
      var englishLabel = { focus: "Focus", date: "Date", time: "Time", contact: "Contact" }[key];
      var item = labels.find(function(el){ return el.textContent.trim() === englishLabel; });
      if (item && item.parentElement) item.parentElement.setAttribute("data-brief-key", key);
    });
  }

  function setBrief(key, value) {
    var item = document.querySelector('[data-brief-key="'+key+'"]');
    if (!item || !item.parentElement) return;
    var target = item.children[1];
    if (target) {
      target.textContent = value || "-";
      target.style.color = value ? "rgb(33, 29, 23)" : "rgb(181, 173, 156)";
    }
  }

  function focusLabel(value) {
    var option = copy.focusOptions.find(function(item){ return item.value === value; });
    return option ? option.title : value;
  }

  function localizeShell() {
    prepareBriefTargets();
    if (!paidVariant) return;

    document.documentElement.lang = "sv";
    document.title = copy.title;
    var heading = document.querySelector("body > h1");
    if (heading) heading.textContent = copy.heading;
    [
      ['meta[name="description"]', copy.description],
      ['meta[property="og:title"]', copy.title],
      ['meta[property="og:description"]', copy.description],
      ['meta[name="twitter:title"]', copy.title],
      ['meta[name="twitter:description"]', copy.description]
    ].forEach(function(entry){
      var meta = document.querySelector(entry[0]);
      if (meta) meta.setAttribute("content", entry[1]);
    });

    var rail = document.querySelector("[data-rail]");
    if (rail) {
      if (rail.children[1]) rail.children[1].textContent = copy.briefHeading;
      if (rail.children[3]) rail.children[3].innerHTML = copy.railDescription;
    }
    Object.keys(copy.briefLabels).forEach(function(key){
      var item = document.querySelector('[data-brief-key="'+key+'"]');
      if (item && item.children[0]) item.children[0].textContent = copy.briefLabels[key];
    });

    var currentStepLabels = ["Focus", "Time", "Details", "Confirmed"];
    Array.prototype.slice.call(stepper.querySelectorAll("span")).forEach(function(label){
      var index = currentStepLabels.indexOf(label.textContent.trim());
      if (index !== -1) label.textContent = copy.stepLabels[index];
    });
    back.textContent = copy.back;
    next.textContent = copy.continue;
    document.documentElement.dataset.bookingReady = "true";
  }

  function activateNext(enabled) {
    next.disabled = !enabled;
    next.style.cursor = enabled ? "pointer" : "not-allowed";
    next.style.background = enabled ? "rgb(33, 29, 23)" : "rgba(33, 29, 23, 0.12)";
    next.style.color = enabled ? "rgb(245, 241, 232)" : "rgba(33, 29, 23, 0.4)";
  }

  function paintStepper() {
    var circles = Array.prototype.slice.call(stepper.querySelectorAll("span")).filter(function(el){
      return /^[1-4]$/.test(el.textContent.trim());
    });
    circles.forEach(function(el, index){
      var active = index + 1 <= step;
      el.style.background = active ? "rgb(33, 29, 23)" : "transparent";
      el.style.color = active ? "rgb(245, 241, 232)" : "rgb(154, 147, 132)";
      el.style.borderColor = active ? "rgb(33, 29, 23)" : "rgba(33, 29, 23, 0.25)";
    });
    back.style.pointerEvents = step === 1 ? "none" : "auto";
    back.style.color = step === 1 ? "rgba(33, 29, 23, 0.25)" : "rgb(90, 83, 71)";
  }

  function choiceButton(title, body, attrs) {
    attrs = attrs || "";
    return '<button '+attrs+' style="text-align:left;cursor:pointer;padding:16px 18px;border-radius:4px;background:rgb(250,247,240);border:1px solid rgba(33,29,23,.16);box-shadow:none;transition:background .2s,border-color .2s,box-shadow .2s;">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;">'
      + '<span style="font-size:16px;font-weight:500;">'+text(title)+'</span>'
      + '<span style="font-family:&quot;IBM Plex Mono&quot;,monospace;font-size:14px;color:rgb(168,67,43);">◇</span></div>'
      + '<div style="font-size:13px;color:rgb(90,83,71);margin-top:4px;">'+text(body)+'</div></button>';
  }

  function isoDate(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  function displayDate(value) {
    var parts = String(value).split("-");
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return date.toLocaleDateString(paidVariant ? "sv-SE" : "en-GB", {
      weekday: "short",
      day: "numeric",
      month: "long"
    });
  }

  function displayLongDate(value) {
    var parts = String(value).split("-");
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return date.toLocaleDateString("sv-SE", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });
  }

  function addBusinessDays(count) {
    var date = new Date();
    var added = 0;
    while (added < count) {
      date.setDate(date.getDate() + 1);
      var day = date.getDay();
      if (day !== 0 && day !== 6) added += 1;
    }
    return date;
  }

  function dayOptions() {
    return [
      { label: copy.dayLabels[0], date: isoDate(addBusinessDays(1)) },
      { label: copy.dayLabels[1], date: isoDate(addBusinessDays(3)) },
      { label: copy.dayLabels[2], date: isoDate(addBusinessDays(6)) }
    ];
  }

  function sameMonth(left, right) {
    return left.getFullYear() === right.getFullYear() && left.getMonth() === right.getMonth();
  }

  function calendarBounds() {
    var minimum = new Date();
    minimum.setHours(12, 0, 0, 0);
    minimum.setDate(minimum.getDate() + 1);
    var maximum = new Date();
    maximum.setHours(12, 0, 0, 0);
    maximum.setDate(maximum.getDate() + 60);
    return { minimum: minimum, maximum: maximum };
  }

  function isBookableDate(date) {
    var bounds = calendarBounds();
    var weekday = date.getDay();
    return date >= bounds.minimum && date <= bounds.maximum && weekday !== 0 && weekday !== 6;
  }

  function calendarMarkup() {
    var bounds = calendarBounds();
    var monthStart = new Date(calendarView.getFullYear(), calendarView.getMonth(), 1, 12);
    var monthEnd = new Date(calendarView.getFullYear(), calendarView.getMonth() + 1, 0, 12);
    var leading = (monthStart.getDay() + 6) % 7;
    var days = [];
    for (var blank = 0; blank < leading; blank += 1) {
      days.push('<span class="calendar-blank" aria-hidden="true"></span>');
    }
    for (var day = 1; day <= monthEnd.getDate(); day += 1) {
      var date = new Date(calendarView.getFullYear(), calendarView.getMonth(), day, 12);
      var value = isoDate(date);
      var selected = state.date === value;
      days.push(
        '<button type="button" class="calendar-day'+(selected ? ' is-selected' : '')+'" data-calendar-date="'+value+'"'
        +(isBookableDate(date) ? '' : ' disabled')
        +' aria-label="'+text(displayLongDate(value))+'" aria-pressed="'+(selected ? 'true' : 'false')+'">'+day+'</button>'
      );
    }
    var currentMonth = new Date();
    currentMonth.setHours(12, 0, 0, 0);
    currentMonth.setDate(1);
    var lastMonth = new Date(bounds.maximum.getFullYear(), bounds.maximum.getMonth(), 1, 12);
    var title = calendarView.toLocaleDateString("sv-SE", { month: "long", year: "numeric" });
    return '<section class="booking-calendar" aria-label="Välj datum">'
      + '<div class="calendar-toolbar">'
      + '<button type="button" class="calendar-nav" data-calendar-prev aria-label="Föregående månad"'
      +(sameMonth(calendarView, currentMonth) ? ' disabled' : '')+'>←</button>'
      + '<strong>'+text(title)+'</strong>'
      + '<button type="button" class="calendar-nav" data-calendar-next aria-label="Nästa månad"'
      +(sameMonth(calendarView, lastMonth) ? ' disabled' : '')+'>→</button>'
      + '</div>'
      + '<div class="calendar-weekdays" aria-hidden="true"><span>Mån</span><span>Tis</span><span>Ons</span><span>Tor</span><span>Fre</span><span>Lör</span><span>Sön</span></div>'
      + '<div class="calendar-grid">'+days.join("")+'</div>'
      + '</section>';
  }

  function availabilityPlaceholder() {
    return '<section class="availability-panel" data-availability-panel aria-live="polite">'
      + '<p class="availability-label">Lediga tider</p>'
      + '<h3>Välj ett datum</h3>'
      + ''
      + '</section>';
  }

  function renderAvailability(date) {
    var panel = content.querySelector("[data-availability-panel]");
    if (!panel) return;
    var request = availabilityRequest += 1;
    panel.innerHTML = '<p class="availability-label">Lediga tider</p>'
      + '<h3>'+text(displayLongDate(date))+'</h3>'
      + '<p class="availability-message">Kontrollerar kalendern...</p>';

    fetch(availabilityEndpoint + "?date=" + encodeURIComponent(date), {
      method: "GET",
      cache: "no-store",
      headers: { Accept: "application/json" }
    })
      .then(function(response){
        if (!response.ok) throw new Error("Availability returned " + response.status);
        return response.text();
      })
      .then(function(raw){
        if (request !== availabilityRequest) return;
        if (!raw) throw new Error("Availability returned an empty response");
        var result = JSON.parse(raw);
        var times = Array.isArray(result.offered) ? result.offered : [];
        var busy = Array.isArray(result.busy) ? result.busy : [];
        var capped = result.capped === true;
        if (!times.length) throw new Error("Availability returned no offered times");
        panel.innerHTML = '<p class="availability-label">Lediga tider</p>'
          + '<h3>Välj en tid</h3>'
          + '<p class="availability-date">'+text(displayLongDate(date))+'</p>'
          +(capped ? '<p class="availability-message" style="margin:0 0 14px;">Dagen är fullbokad. Välj en annan dag.</p>' : '')
          + '<div class="time-grid">'
          + times.map(function(time){
            var unavailable = busy.indexOf(time) !== -1;
            var selected = state.time === time;
            return '<button type="button" class="time-slot'+(selected ? ' is-selected' : '')+'" data-time="'+time+'"'
              +(unavailable ? ' disabled' : '')
              +' aria-pressed="'+(selected ? 'true' : 'false')+'"><strong>'+time+'</strong><span>'
              +(capped ? 'Fullbokad' : unavailable ? 'Upptagen' : 'Ledig')+'</span></button>';
          }).join("")
          + '</div>';
        panel.querySelectorAll("[data-time]").forEach(function(button){
          button.addEventListener("click", function(){
            state.time = button.getAttribute("data-time");
            setBrief("time", state.time);
            panel.querySelectorAll("[data-time]").forEach(function(other){
              other.classList.toggle("is-selected", other === button);
              other.setAttribute("aria-pressed", other === button ? "true" : "false");
            });
            activateNext(!!state.date && !!state.time);
          });
        });
      })
      .catch(function(){
        if (request !== availabilityRequest) return;
        panel.innerHTML = '<p class="availability-label">Lediga tider</p>'
          + '<h3>Kalendern kunde inte läsas</h3>'
          + '<p class="availability-message">Försök igen eller välj ett annat datum. Ingen tid kan bokas utan en aktuell kalenderkontroll.</p>';
      });
  }

  function bindCalendar() {
    var previous = content.querySelector("[data-calendar-prev]");
    var nextMonth = content.querySelector("[data-calendar-next]");
    if (previous) previous.addEventListener("click", function(){
      state.date = "";
      state.dateLabel = "";
      state.time = "";
      setBrief("date", "");
      setBrief("time", "");
      calendarView.setMonth(calendarView.getMonth() - 1);
      renderTime();
    });
    if (nextMonth) nextMonth.addEventListener("click", function(){
      state.date = "";
      state.dateLabel = "";
      state.time = "";
      setBrief("date", "");
      setBrief("time", "");
      calendarView.setMonth(calendarView.getMonth() + 1);
      renderTime();
    });
    content.querySelectorAll("[data-calendar-date]").forEach(function(button){
      button.addEventListener("click", function(){
        state.date = button.getAttribute("data-calendar-date");
        state.dateLabel = displayLongDate(state.date);
        state.time = "";
        setBrief("date", state.dateLabel);
        setBrief("time", "");
        content.querySelectorAll("[data-calendar-date]").forEach(function(other){
          other.classList.toggle("is-selected", other === button);
          other.setAttribute("aria-pressed", other === button ? "true" : "false");
        });
        activateNext(false);
        renderAvailability(state.date);
      });
    });
    if (state.date) renderAvailability(state.date);
  }

  function renderFocus() {
    step = 1;
    content.innerHTML = '<div style="animation:.35s ease 0s 1 normal both running fadeup;flex:1;display:flex;flex-direction:column;">'
      + '<h2 style="font-family:Newsreader,serif;font-weight:400;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.02em;margin:0 0 6px;">'+text(copy.focusHeading)+'</h2>'
      + '<p style="font-size:14.5px;color:rgb(90,83,71);margin:0 0 22px;">'+text(copy.focusDescription)+'</p>'
      + '<div style="display:flex;flex-direction:column;gap:10px;">'
      + copy.focusOptions.map(function(option){
        return choiceButton(option.title, option.body, 'data-focus="'+text(option.value)+'"');
      }).join("")
      + '</div></div>';
    content.querySelectorAll("[data-focus]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.focus = btn.getAttribute("data-focus");
        setBrief("focus", focusLabel(state.focus));
        content.querySelectorAll("[data-focus]").forEach(function(other){
          other.style.borderColor = other === btn ? "rgb(168, 67, 43)" : "rgba(33, 29, 23, 0.16)";
          other.style.background = other === btn ? "rgba(168, 67, 43, 0.06)" : "rgb(250,247,240)";
        });
        activateNext(true);
      });
    });
    if (paidVariant && state.focus) {
      var selected = Array.prototype.slice.call(content.querySelectorAll("[data-focus]")).find(function(btn){
        return btn.getAttribute("data-focus") === state.focus;
      });
      if (selected) {
        selected.style.borderColor = "rgb(168, 67, 43)";
        selected.style.background = "rgba(168, 67, 43, 0.06)";
      }
    }
    next.textContent = copy.continue;
    activateNext(!!state.focus);
    paintStepper();
  }

  function renderTime() {
    step = 2;
    if (paidVariant) {
      content.innerHTML = '<div style="animation:.35s ease 0s 1 normal both running fadeup;flex:1;display:flex;flex-direction:column;">'
        + '<h2 style="font-family:Newsreader,serif;font-weight:400;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.02em;margin:0 0 6px;">Välj en tid</h2>'
        + '<p style="font-size:14.5px;color:rgb(90,83,71);margin:0 0 22px;">Upptagna tider hämtas direkt från kalendern.</p>'
        + '<div class="booking-scheduler">'+calendarMarkup()+availabilityPlaceholder()+'</div></div>';
      bindCalendar();
      next.textContent = copy.continue;
      activateNext(!!state.date && !!state.time);
      paintStepper();
      return;
    }
    var days = dayOptions();
    var times = ["09:30", "11:00", "14:00", "16:00"];
    content.innerHTML = '<div style="animation:.35s ease 0s 1 normal both running fadeup;flex:1;display:flex;flex-direction:column;">'
      + '<h2 style="font-family:Newsreader,serif;font-weight:400;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.02em;margin:0 0 6px;">'+text(copy.timeHeading)+'</h2>'
      + '<p style="font-size:14.5px;color:rgb(90,83,71);margin:0 0 22px;">'+text(copy.timeDescription)+'</p>'
      + '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px;">'
      + days.map(function(day){ return choiceButton(day.label, displayDate(day.date), 'data-date="'+day.date+'" data-date-label="'+day.label+'"'); }).join("")
      + '</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;">'
      + times.map(function(t){ return choiceButton(t, "Europe/Stockholm", 'data-time="'+t+'"'); }).join("")
      + '</div></div>';
    content.querySelectorAll("[data-date]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.date = btn.getAttribute("data-date");
        state.dateLabel = btn.getAttribute("data-date-label") || state.date;
        setBrief("date", state.dateLabel);
        content.querySelectorAll("[data-date]").forEach(function(other){ other.style.borderColor = other === btn ? "rgb(168,67,43)" : "rgba(33,29,23,.16)"; });
        activateNext(!!state.date && !!state.time);
      });
    });
    content.querySelectorAll("[data-time]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.time = btn.getAttribute("data-time");
        setBrief("time", state.time);
        content.querySelectorAll("[data-time]").forEach(function(other){ other.style.borderColor = other === btn ? "rgb(168,67,43)" : "rgba(33,29,23,.16)"; });
        activateNext(!!state.date && !!state.time);
      });
    });
    next.textContent = copy.continue;
    activateNext(!!state.date && !!state.time);
    paintStepper();
  }

  function input(name, label, type) {
    var maxLength = name === "email" ? 254 : name === "company" ? 160 : 120;
    return '<label style="display:grid;gap:6px;font-size:13px;color:rgb(90,83,71);">'+text(label)
      + '<input name="'+name+'" type="'+(type || "text")+'" maxlength="'+maxLength+'" required style="width:100%;border:1px solid rgba(33,29,23,.16);background:rgb(250,247,240);border-radius:4px;padding:13px 14px;color:rgb(33,29,23);outline:none;"></label>';
  }

  function renderDetails() {
    step = 3;
    content.innerHTML = '<form id="booking-details" style="animation:.35s ease 0s 1 normal both running fadeup;flex:1;display:flex;flex-direction:column;">'
      + '<h2 style="font-family:Newsreader,serif;font-weight:400;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.02em;margin:0 0 6px;">'+text(copy.detailsHeading)+'</h2>'
      + '<p style="font-size:14.5px;color:rgb(90,83,71);margin:0 0 22px;">'+text(copy.detailsDescription)+'</p>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">'+input("name",copy.fields.name)+input("email",copy.fields.email,"email")+'</div>'
      + input("company",copy.fields.company) + '<label style="display:grid;gap:6px;font-size:13px;color:rgb(90,83,71);margin-top:12px;">'+text(copy.fields.notes)+'<textarea name="notes" rows="4" maxlength="1000" style="width:100%;border:1px solid rgba(33,29,23,.16);background:rgb(250,247,240);border-radius:4px;padding:13px 14px;color:rgb(33,29,23);outline:none;resize:vertical;"></textarea></label>'
      + '<p style="font-size:12px;line-height:1.5;color:rgb(90,83,71);margin:14px 0 0;"><a href="/privacy.html" style="color:inherit;text-underline-offset:.18em;">'+text(copy.privacyLabel)+'</a></p>'
      + '</form>';
    var form = content.querySelector("form");
    form.addEventListener("input", function(){
      state.name = form.elements.name.value.trim();
      state.email = form.elements.email.value.trim();
      state.company = form.elements.company.value.trim();
      state.notes = form.elements.notes.value.trim();
      setBrief("contact", state.name || state.email);
      activateNext(form.checkValidity());
    });
    next.textContent = copy.send;
    activateNext(form.checkValidity());
    paintStepper();
  }

  function renderConfirmed(ok) {
    step = 4;
    content.innerHTML = '<div style="animation:.35s ease 0s 1 normal both running fadeup;flex:1;display:flex;flex-direction:column;justify-content:center;">'
      + '<h2 style="font-family:Newsreader,serif;font-weight:400;font-size:clamp(28px,3.8vw,40px);letter-spacing:-.02em;margin:0 0 12px;">'+text(ok ? copy.sentHeading : copy.failedHeading)+'</h2>'
      + '<p style="font-size:15px;line-height:1.6;color:rgb(90,83,71);max-width:44ch;margin:0;">'+text(ok ? copy.sentDescription : copy.fallback)+'</p>'
      + '</div>';
    next.style.display = "none";
    back.textContent = copy.startOver;
    back.style.pointerEvents = "auto";
    back.style.color = "rgb(90, 83, 71)";
    paintStepper();
  }

  async function submit() {
    next.disabled = true;
    next.textContent = copy.sending;
    bookingRequestId = window.crypto.randomUUID();
    captureBooking("nordsym_booking_submitted", { focus: state.focus, request_id: bookingRequestId, step_index: 7, step_name: "booking_submitted" });
    var submissionState = Object.assign({}, state);
    if (paidVariant && (preCallContext.work_description || preCallContext.consequence_other_detail)) {
      var contextLines = [];
      if (preCallContext.work_description) contextLines.push("Återkommande arbete: " + String(preCallContext.work_description).slice(0, 280));
      if (preCallContext.consequence_other_detail) contextLines.push("Annan konsekvens: " + String(preCallContext.consequence_other_detail).slice(0, 160));
      submissionState.notes = contextLines.concat(state.notes ? [state.notes] : []).join("\n").slice(0, 1000);
    }
    try {
      var res = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(Object.assign({
          requestId: bookingRequestId,
          source: webhookSource,
          locale: paidVariant ? "sv-SE" : "en-GB",
          offerKey: paidVariant ? SUPPORTED_ROUTE.offer : "default",
          submittedAt: new Date().toISOString()
        }, submissionState, {
          acquisition: Object.assign({}, acquisition, paidVariant ? {
            lang: SUPPORTED_ROUTE.lang,
            offer: SUPPORTED_ROUTE.offer
          } : {})
        }))
      });
      var responseBody = await res.json().catch(function () { return null; });
      var booked = res.ok && responseBody && responseBody.success === true;
      captureBooking(booked ? "nordsym_booking_succeeded" : "nordsym_booking_failed", { focus: state.focus, request_id: bookingRequestId, step_index: booked ? 8 : 7, step_name: booked ? "booking_succeeded" : "booking_failed" });
      renderConfirmed(booked);
    } catch (err) {
      captureBooking("nordsym_booking_failed", { focus: state.focus, reason: "network", request_id: bookingRequestId, step_index: 7, step_name: "booking_failed" });
      renderConfirmed(false);
    }
  }

  next.addEventListener("click", function(){
    if (step === 1 && state.focus) {
      captureBooking("nordsym_booking_focus_selected", { focus: state.focus });
      return renderTime();
    }
    if (step === 2 && state.date && state.time) {
      captureBooking("nordsym_booking_time_selected");
      return renderDetails();
    }
    if (step === 3) {
      var detailsForm = document.getElementById("booking-details");
      if (!detailsForm || !detailsForm.checkValidity()) {
        if (detailsForm) detailsForm.reportValidity();
        return;
      }
      return submit();
    }
  });
  back.addEventListener("click", function(){
    if (step === 1) return;
    if (step === 4) {
      next.style.display = "";
      back.textContent = copy.back;
      state = initialState();
      ["focus","date","time","contact"].forEach(function(key){ setBrief(key, ""); });
      if (paidVariant) {
        setBrief("focus", focusLabel(state.focus));
        return renderTime();
      }
      return renderFocus();
    }
    if (step === 3) return renderTime();
    if (step === 2) return renderFocus();
  });
  localizeShell();
  if (paidVariant) {
    setBrief("focus", focusLabel(state.focus));
    renderTime();
  } else {
    renderFocus();
  }
})();
</script>
