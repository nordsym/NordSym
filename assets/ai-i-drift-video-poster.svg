<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NordSym, från demo till drift</title>
  <desc id="desc">En mörk operationskarta med styrda stopp och undantag.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#f3eee4" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#17140f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M110 110h80M110 110v80M1490 710v80M1490 790h-80" fill="none" stroke="#f3eee4" stroke-opacity=".28" stroke-width="2"/>
  <text x="120" y="170" fill="#e08a6e" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="4">NORDSYM OPERATIONSBRIEF</text>
  <text x="120" y="280" fill="#f3eee4" font-family="Newsreader, Georgia, serif" font-size="84">Från demo till</text>
  <text x="120" y="365" fill="#f3eee4" font-family="Newsreader, Georgia, serif" font-size="84">styrd operation.</text>
  <g transform="translate(120 500)">
    <rect width="242" height="92" fill="#211d17" stroke="#f3eee4" stroke-opacity=".28"/>
    <text x="24" y="36" fill="#e08a6e" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2">01</text>
    <text x="24" y="68" fill="#f3eee4" font-family="Instrument Sans, sans-serif" font-size="22">Startsignal</text>
    <path d="M242 46h86" stroke="#f3eee4" stroke-opacity=".32" stroke-width="2"/>
    <rect x="328" width="242" height="92" fill="#211d17" stroke="#f3eee4" stroke-opacity=".28"/>
    <text x="352" y="36" fill="#e08a6e" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2">02</text>
    <text x="352" y="68" fill="#f3eee4" font-family="Instrument Sans, sans-serif" font-size="22">Systemarbete</text>
    <path d="M570 46h86" stroke="#f3eee4" stroke-opacity=".32" stroke-width="2"/>
    <rect x="656" width="242" height="92" fill="#211d17" stroke="#a8432b" stroke-width="2"/>
    <text x="680" y="36" fill="#e08a6e" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2">03</text>
    <text x="680" y="68" fill="#f3eee4" font-family="Instrument Sans, sans-serif" font-size="22">Undantag</text>
    <path d="M898 46h86" stroke="#f3eee4" stroke-opacity=".32" stroke-width="2"/>
    <rect x="984" width="242" height="92" fill="#211d17" stroke="#f3eee4" stroke-opacity=".28"/>
    <text x="1008" y="36" fill="#e08a6e" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2">04</text>
    <text x="1008" y="68" fill="#f3eee4" font-family="Instrument Sans, sans-serif" font-size="22">Mätbar drift</text>
  </g>
  <g transform="translate(722 704)">
    <circle cx="78" cy="78" r="77" fill="#a8432b"/>
    <path d="M62 45l50 33-50 33z" fill="#f8f4ec"/>
  </g>
  <text x="120" y="810" fill="#bdb3a1" font-family="Instrument Sans, sans-serif" font-size="24">Vad måste fungera när normalfallet tar slut?</text>
