<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Inför kartläggningen | NordSym</title>
  <meta name="description" content="Svara på fem frågor om nuläget och boka sedan ett 20-minutersmöte.">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/nordsym-favicon.svg">
  <link rel="stylesheet" href="/assets/fonts/nordsym-fonts.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./bridge.css">
  <link rel="stylesheet" href="/assets/meta-measurement.css">
</head>
<body class="bridge-page">
  <a class="skip-link" href="#main">Hoppa till innehållet</a>

  <header class="site-header bridge-header">
    <a class="brand" href="/" aria-label="NordSym, startsida">
      <img src="/assets/brand/nordsym-header-lockup.svg" alt="NordSym" width="186" height="50">
    </a>
    <span class="header-note">AI-agenter i er tech stack</span>
  </header>

  <main id="main" class="bridge-main">
    <section class="bridge-shell" aria-labelledby="bridge-title">
      <div class="bridge-intro">
        <p class="kicker">Inför kartläggningen</p>
        <h1 id="bridge-title">Fem frågor före mötet.</h1>
      </div>

      <div class="bridge-video-frame">
        <video
          id="bridge-video"
          data-media-status="local-review-candidate"
          controls
          playsinline
          preload="metadata"
          poster="/assets/ai-i-drift-video-poster.jpg"
          aria-describedby="video-expectation"
        >
          <source src="/assets/video/ai-i-drift-sa-fungerar-det-v3.mp4" type="video/mp4">
          <track
            default
            kind="captions"
            srclang="sv"
            label="Svenska"
            src="/assets/video/ai-i-drift-sa-fungerar-det-v3.sv.vtt"
          >
          Din webbläsare kan inte spela upp videon.
        </video>
      </div>

      <div class="bridge-action">
        <a
          id="bridge-cta"
          class="button button-primary"
          href="/ai-i-drift/kvalificering/"
          data-placement="video_bridge"
        >
          Svara på fem frågor
          <span aria-hidden="true">→</span>
        </a>
        <p id="video-expectation">Därefter väljer ni en tid för ett 20-minutersmöte.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer bridge-footer">
    <img src="/assets/brand/nordsym-footer-lockup.svg" alt="NordSym" width="156" height="42">
    <p>NordSym AB</p>
  </footer>

  <script id="nordsym-posthog">
  (function(){
    if (window.__nordsymPosthogLoaded) return;
    window.__nordsymPosthogLoaded = true;
    var campaign = {};
    var params = new URLSearchParams(location.search);
    ['utm_source','utm_medium','utm_campaign','utm_id','utm_content'].forEach(function(key){
      var raw = String(params.get(key) || '').trim();
      if (!raw || raw.indexOf('@') !== -1 || raw.replace(/\D/g, '').length >= 7) return;
      var value = raw
        .toLowerCase()
        .replace(/[^a-z0-9._~-]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 120);
      if (value) campaign[key] = value;
    });
    window.__nordsymPaidContext = campaign;
    !function(d,p){var s=d.createElement('script'),first=d.getElementsByTagName('script')[0];p=p||[];window.posthog=p;p._i=p._i||[];p.init=function(token,config,name){var target=name?p[name]=[]:p;target.people=target.people||[];['capture','register','set_config'].forEach(function(method){target[method]=function(){target.push([method].concat(Array.prototype.slice.call(arguments)));};});p._i.push([token,config,name]);};s.async=true;s.crossOrigin='anonymous';s.src='https://eu-assets.i.posthog.com/static/array.js';first.parentNode.insertBefore(s,first);}(document,window.posthog);
    window.posthog.init('phc_prXdjcKDtkz7BUsTooS42jKjZerJtL7GmtYSRCNGZpmR', {
      api_host: 'https://eu.i.posthog.com',
      ui_host: 'https://eu.posthog.com',
      defaults: '2026-05-30',
      cookieless_mode: 'always',
      person_profiles: 'identified_only',
      autocapture: false,
      capture_pageview: false,
      capture_pageleave: false,
      disable_session_recording: true,
      loaded: function(posthog) {
        posthog.register({ product: 'Nordsym-Com', surface: 'lp_ai_i_drift_bridge', offer: 'ai_i_drift' });
        posthog.capture('$pageview', Object.assign({ path: location.pathname, privacy_mode: 'server_hash' }, campaign));
      }
    });
  })();
  </script>
  <script src="/assets/meta-measurement.js" defer></script>
  <script src="./bridge.js" defer></script>
</body>
</html>
